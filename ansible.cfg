[defaults]
inventory = inventories/raspberries.ini
host_key_checking = false

# vault_password_file is deliberately NOT set here. Ansible resolves it eagerly
# at startup and aborts when the file is missing or empty, even for a run that
# touches nothing encrypted, so a checkout without the vault could not apply
# any role at all. Supply it per invocation for the runner registration, which
# is the only thing needing a secret:
#
#   ANSIBLE_VAULT_PASSWORD_FILE=.ansible_vault_pass ansible-playbook site.yml -K
#   ansible-playbook site.yml -K --ask-vault-pass --tags github_runner