---
pihole_user: "{{ ansible_user }}"
pihole_base_directory: "/home/{{ ansible_user }}/pihole"
pihole_image: "pihole/pihole:latest"
pihole_container_name: "pihole"
pihole_timezone: "Europe/Paris"

# Host networking binds the web server straight onto the host, and port 80 is
# already taken by the Home Assistant redirect (roles/home_assistant), so the
# admin UI moves to 8080/8443. The trailing "o" marks a port optional, so FTL
# still starts if one of them is busy; "s" marks HTTPS.
pihole_http_port: 8080
pihole_https_port: 8443
pihole_web_port: >-
  {{ pihole_http_port }}o,[::]:{{ pihole_http_port }}o,{{ pihole_https_port }}os,[::]:{{ pihole_https_port }}os

# Semicolon-delimited, as FTLCONF_dns_upstreams expects.
pihole_dns_upstreams: "9.9.9.9;149.112.112.112"

# Orange TV. With the Livebox's DHCP off, the TV box shows error G03 unless
# two things the Livebox used to provide are reproduced:
#
# 1. DNS for private orange.fr names (oras.vci.pgw.orange.fr,
#    rmstb.stb.orion.itv.orange.fr, ...) that only Orange's own DNS answers;
#    public resolvers return SERVFAIL. The whole orange.fr zone is forwarded
#    to the Livebox, so new private names are covered too. Blocklists still
#    apply, since FTL checks them before forwarding.
# 2. The Livebox's identity in the DHCP reply: option 125 (vendor-identifying
#    vendor-specific information, enterprise 3561) with sub-options 4
#    (manufacturer OUI, from the Livebox MAC), 5 (serial number) and 6
#    (product class), plus the Livebox as router and DNS server, for the TV
#    box's MAC only. Serial and product class come from the Livebox API
#    (DeviceInfo.get); they change if the Livebox is swapped.
pihole_livebox_address: "192.168.1.1"
pihole_orange_tv_enabled: true
pihole_orange_tv_mac: "48:d2:4f:84:48:36"
pihole_livebox_oui: "3093BC"
pihole_livebox_serial: "DM1932229001903"
pihole_livebox_product_class: "Livebox Fibre"

pihole_orange_tv_dnsmasq_lines:
  - "server=/orange.fr/{{ pihole_livebox_address }}"
  - "dhcp-host={{ pihole_orange_tv_mac }},set:decodeur"
  - "dhcp-option=tag:decodeur,option:router,{{ pihole_livebox_address }}"
  - "dhcp-option=tag:decodeur,option:domain-name,{{ pihole_dns_domain }}"
  - "dhcp-option=tag:decodeur,option:dns-server,{{ pihole_livebox_address }}"
  - 'dhcp-option-force=tag:decodeur,vi-encap:3561,4,"{{ pihole_livebox_oui }}"'
  - 'dhcp-option-force=tag:decodeur,vi-encap:3561,5,"{{ pihole_livebox_serial }}"'
  - 'dhcp-option-force=tag:decodeur,vi-encap:3561,6,"{{ pihole_livebox_product_class }}"'

# Extra dnsmasq lines (FTLCONF_misc_dnsmasq_lines), one per entry.
pihole_dnsmasq_lines: "{{ pihole_orange_tv_dnsmasq_lines if pihole_orange_tv_enabled | bool else [] }}"

# The Livebox exposes no setting for the DNS server it hands out, so the only
# way to make Pi-hole the default for every device is to let Pi-hole be the
# DHCP server and switch the Livebox's off. Never run both at once.
pihole_dhcp_enabled: true
pihole_dhcp_start: "192.168.1.10"
pihole_dhcp_end: "192.168.1.150"
pihole_dhcp_router: "192.168.1.1"
pihole_dhcp_netmask: "255.255.255.0"
pihole_dhcp_lease_time: "24h"

# Static leases, "<mac>,<ip>,<hostname>". emerson is listed even though it
# configures its address itself (pihole_static_*), so the pool never hands .39
# to anyone else.
pihole_dhcp_hosts:
  - "2c:cf:67:bf:a4:3b,192.168.1.39,emerson"
  - "00:90:a9:ef:38:fc,192.168.1.10,MyCloudFerrera"

# The Livebox served the .home domain; keeping it means `<host>.home` names and
# the `home` search domain keep working after the switch.
pihole_dns_domain: "home"

# A DHCP server cannot lease an address to itself, so the host's own address is
# configured statically before Pi-hole takes over DHCP. The host resolves
# through Quad9 directly rather than through Pi-hole, so it can still pull
# images and repair itself while the container is down.
pihole_static_interface: "eth0"
pihole_static_address: "192.168.1.39/24"
pihole_static_gateway: "192.168.1.1"
pihole_static_nameservers:
  - "9.9.9.9"
  - "149.112.112.112"
pihole_static_search_domains:
  - "home"

# Secret file pre-provisioned on the host (mode 0600), NOT managed by this
# role so the repository stays secret-free:
#   .webpassword   admin password for the Pi-hole web interface
pihole_password_file: ".webpassword"
